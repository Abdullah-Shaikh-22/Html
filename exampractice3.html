<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordered And Unorderd List</title>
</head>
<body>
    <h3>
        Orderd list
    </h3>
    <ol>
        <li>
            Html
        </li>
        <li>
            Css
        </li>
    </ol>
    <h3>
        Unordered List
    </h3>
    <ul>
        <li>
            Apple
        </li>
        <li>
            Mango
        </li>
    </ul>
    <h3>
        Defination List
    </h3>
    <dl>
        <dt>
            Html
        </dt>
        <dd>
            Structure Of Web Page
        </dd>
    </dl>
</body>
</html>
